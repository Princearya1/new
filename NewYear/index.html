<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy New Year, My Love!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Happy New Year, Babu! 🎉</h1>

        <div id="countdown" aria-label="Countdown until New Year">
            <div class="timepart"><span id="days">00</span><small>Days</small></div>
            <div class="timepart"><span id="hours">00</span><small>Hours</small></div>
            <div class="timepart"><span id="minutes">00</span><small>Minutes</small></div>
            <div class="timepart"><span id="seconds">00</span><small>Seconds</small></div>
        </div>

        <p class="message">
            Meri Pallu❤️,<br>
            Thank you for coming into my life and filling it with warmth, strength and endless love.<br>
            You make every day brighter — I can't wait to share another beautiful year with you.<br>
            <span class="heart">❤️</span>
        </p>

        <div class="controls">
            <button id="celebrate">Celebrate 🎆</button>
            <div id="music">
                <div id="player"></div>
                <button id="music-toggle">Play Music</button>
            </div>
        </div>

        <canvas id="confetti-canvas" aria-hidden="true"></canvas>

        <section class="slideshow-section">
            <h2>Our Memories</h2>
            <div id="slideshow">
                <button id="prev" aria-label="Previous photo">‹</button>
                <img id="slide" alt="Photo slideshow">
                <button id="next" aria-label="Next photo">›</button>
            </div>
        </section>

        <div class="fireworks">
            <div class="firework"></div>
            <div class="firework"></div>
            <div class="firework"></div>
        </div>

        <footer>
            <p>With all my love, <span class="signature">Your Love</span></p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
